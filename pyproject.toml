[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oracle-plus"
version = "0.1.0"
description = "Oracle-Plus Python CLI — Node @steipete/oracle wrapper with port-lock and run-state contracts."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
oracle-plus = "oracle_plus.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
